<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
    <style>

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #050521;
            color: white;
        }

        h1 {
            font-size: 2.9rem;
            color: white;
            text-shadow:0 -2px 5px #4ffe86;
            letter-spacing: 3px;
            font-family: "Playfair Display", serif;
        }

        .stuff{
            display: flex;
            width: 90vmin;
            justify-content: space-around;
            align-items: center;
            font-size: 20px;
            font-family: "Great Vibes", cursive;
            width: 750px;
        }

        .start {
            background-color: #38ef7d;
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgb(2, 67, 54) ;
        }

        .start button{
            background-color: #11998e;
            border: none;
            padding: 10px 15px;
            color: white;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 5px 30px ;
            box-shadow: 0px 0px 2px #244d55;
            font-family: "Montserrat Alternates", sans-serif;
        }

        .box {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            border: 5px solid transparent;
            background: linear-gradient(#15485a,#151515) padding-box,
            linear-gradient(to right, #11998e , #38ef7d);
            padding: 50px;
            border-radius: 20px;
            box-shadow: inset 0px 0px 50px black;
            margin-top: 20px;
        }

        .card {
            width: 110px;
            height: 110px;
            perspective: 1000px;
            position: relative;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .back, .front {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            position: absolute;
            top:0;
            left: 0;
            backface-visibility: hidden;
            transition: transform 0.6s ease;
            
        }

        .front {
            background: linear-gradient(135deg, #141e30, #243b55);
            border: 2px solid #38ef7d;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5),
                0 0 12px rgba(56,239,125,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;

            transform: rotateY(0deg);
        }

        .front::before{
            content: "👽";
            font-size: 2.5rem;
            font-weight: bold;
            color: #38ef7d;
            text-shadow: 0 0 10px rgba(56,239,125,0.8);
        }
        .back {
            transform: rotateY(180deg);
        }

        .card.active .front {
            transform: rotateY(180deg);
        }

        .card.active .back {
            transform: rotateY(0deg);
        }

        .back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        
        .showMessageBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            width: 600px;
            border: 5px solid transparent;
            background: linear-gradient(#15485a,#151515) padding-box,
            linear-gradient(to right, #11998e , #38ef7d);
            padding: 50px;
            border-radius: 20px;
            box-shadow: inset 0px 0px 50px black;
            display: none;
            margin-top: 30px;
        }

        .showMessageBox div {
            margin: 10px;
            color: rgb(2, 189, 2);
            margin-bottom: 40px;
            font-size: 1.5rem;
            text-align: center;
        }

        .restartBtn {
            border :  1px solid green;
            background-color: greenyellow;
            padding: 5px 10px;
            border: none;
            width: auto;    
            border-radius: 5px ;
            color:#243b55;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0px 0px 10px white,
            inset 0px 0px 10px whitesmoke;
            margin-left: 195px;
        }


     
    </style>
</head>
<body>
    <h1>Memory game 🎮</h1>

    <div class="stuff">
        <div class="start">
            <button>Start ❯❯❯❯</button>
        </div>

        </div>
        <div class="count">

        </div>
        <div class="score">
            <p> Score: <span style="color:  red;">0</span> 🏅</p>
        </div>
    </div>

    <div class="showMessageBox"></div>
    <div class="box"></div>

        function shuffleImage(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function showGameBox(){
            totalImages.forEach((img)=>{
            const card = document.createElement("div")
            card.classList.add("card")
            
            const front = document.createElement("div")
            front.classList.add("front")

            const back = document.createElement("div")
            back.classList.add("back")

            const image = document.createElement("img")
            image.src = img

            box.appendChild(card)
            card.appendChild(front)
            card.appendChild(back)
            back.appendChild(image)
       
            card.addEventListener("click", startGame)//()မပါတာ click လုပ်မှသွားခေါ်မှာဖြစ်တဲ့အတွက်

            //         card.classList.toggle("active")
            //     })
            // })

            if(!firstPick) { //firstPick = true //null ကို true ပြောင်း //true ဖြစ်မှ firstPick ထဲဝင် //ture ဖြစ်နေတော့နောက်တစ်ခုကို ထပ်နှိပ်ရင် false အဲ့တော့ if အလုပ်မလုပ်  second pick ထဲဝင်သွားမယ်
                firstPick = this //နှိပ်လိုက်တဲ့ card က firstPickထဲဝင်သွား
                return
            }
            console.log("firstPick", firstPick)

            count++;
            countSpan.textContent= count
            
            secondPick = this;
            console.log("secondPick", secondPick)


            if(firstPick.querySelector(".back img").src  === secondPick.querySelector(".back img").src){
                trueSound.play();
                score++;
                scoreSpan.textContent= score;
                if (score === 6){
                    winSound.play()
                    let message = "";
                    const time = `${minutes} : ${seconds < 10 ? "0" + seconds : seconds}`;

                    if (count < 7) {
                        message = `🎉 Impossible mode! I bet you can’t do better, can you? If you can, you're a memory master! Only ${count} tries and your time was ${time}!`;
                    } else if (count < 10) {
                        message = `😎 Not bad! You remembered most of them! Tries: ${count}, Time: ${time}.`;
                    } else {
                        message = `🤔 Oops! Looks like you need more memory training. Tries: ${count}, Time: ${time}.`;
                    }

                    setTimeout(()=>{

                        box.style.display = "none";
                        showMessageBox.style.display = "block"
                        const showMessage = document.createElement("div")
                        showMessage.textContent = message
                        showMessageBox.appendChild(showMessage)
                       
                        
                        const restartbtn = document.createElement("button")
                        restartbtn.textContent = "Restart 🔄️"
                        restartbtn.classList.add("restartBtn")
                        showMessageBox.appendChild(restartbtn)

                        restartbtn.addEventListener("click", reStart)
                    },800)

                    clearInterval(intervalId)
                    intervalId=null
                }

                firstPick = null;
                secondPick = null;
            }else {
                falseSound.play()
                isBoardLocked= true; //ပုံနှစ်ပုံမညီတာသွားစစ်နေစဉ်အတွင်း ကျန်တာတွေကိုနှိပ်လို့မရအောင်ပိတ်ထားမယ်
                setTimeout(()=> {
                    firstPick.classList.remove("active")
                    secondPick.classList.remove("active")
                    firstPick = null;
                    secondPick = null;
                    isBoardLocked = false;
                },1000)
            }

        }

        function reStart(){
            score = 0 ;
            count = 0 ;
            minutes = 0;
            seconds = 0;
            clearInterval(intervalId);
            intervalId = null;

            isBoardLocked=true;
            timer.textContent= " 00 : 00 ";
            scoreSpan.textContent = "0";
            countSpan.textContent = "0";

            firstPick = null;
            secondPick = null;

            startBtn.textContent = "Start ❯❯❯❯"

            showMessageBox.innerHTML = "";
            box.style.display = "grid";
            box.innerHTML=" ";

            showMessageBox.style.display = "none";

            shuffleImage(totalImages)
            showGameBox()
           
        }

        function startTimer(){
            if(!intervalId){
                intervalId = setInterval(()=> {
                    seconds++;
                    if(seconds===60){
                        minutes++;
                        seconds=0;
                    }

                    timer.textContent=` ${minutes<10?  "0"+minutes : minutes} : ${seconds<10? "0"+seconds : seconds}`
                },1000)
            }
        }

        function previewCard(){
            const cards = document.querySelectorAll(".card")
            cards.forEach((card)=> card.classList.add("active"))

            setTimeout(()=> {
                cards.forEach((card)=>card.classList.remove("active"))
                isBoardLocked = false;
            },1000)
        }




        startBtn.addEventListener("click",()=>{
            if(startBtn.textContent=== "Start ❯❯❯❯") {
                startBtn.textContent = "Stop ❚❚";
                startBtn.style.color = "white";
                isBoardLocked = false;
                startTimer();
                previewCard();
            }else {
                reStart()
            }
            

        })

        showGameBox();
        startGame();
        
        
    </script>
</body>
</html>
